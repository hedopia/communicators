spring:
  main:
    web-application-type: reactive
    keep-alive: true
  application:
    name: IO-${io.driver-id}

server:
  port: 4001
  # h2c on the same port: node-to-node calls upgrade to HTTP/2 and multiplex,
  # browsers and HTTP/1.1 clients are unaffected (Boot picks H2C when no SSL is set)
  http2:
    enabled: true
  netty:
    # reactor-netty rejects an h2c upgrade request carrying a body (default 0B) with 413,
    # and the first internal call to a node is often a POST; the limit only covers the upgrade
    h2c-max-content-length: 64MB

logging:
  file:
    name: log/io-${io.driver-id}.log
  logback:
    rollingpolicy:
      max-history: 1

io:
  driver-id: DRIVER
  load-balancing: false
  driver-base-path: /driver
  node-index: 1
  quorum: 1
  # doubles as the wait for an existing leader at startup, so 0 starts immediately.
  # a single node never needs it; for a real cluster raise it (the library default is 20),
  # otherwise followers time out at once and keep re-electing.
  leader-lost-timeout-seconds: 0
  heartbeat-sending-interval-millis: 2000 # 2 sec
  node-target-urls: http://127.0.0.1:${server.port}
  cluster-base-path: /cluster
  connect-timeout-millis: 1000 # 1 sec
  read-timeout-millis: 60000 # 60 sec
