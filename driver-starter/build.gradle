// driver-starter/pom.xml 대응
// dependencyManagement(netty-bom import) -> platform 의존성으로 netty 버전 정렬
// Reactor Netty 1.3.x와 모든 드라이버 transport가 하나의 Netty 4.2.x를 사용
dependencies {
    api platform('io.netty:netty-bom:4.2.17.Final')

    api project(':cluster-starter')
    api 'org.apache.kafka:kafka-clients:4.3.1'
    api 'org.apache.commons:commons-text:1.15.0'
    api 'org.apache.commons:commons-csv:1.14.1'
    api 'com.digitalpetri.modbus:modbus-tcp:2.1.6'
    api 'com.digitalpetri.netty:netty-channel-fsm:1.0.2' // Milo 1.1.6과 Modbus 2.1.6 공통 버전
    api 'org.eclipse.milo:milo-sdk-client:1.1.6'
    api 'org.eclipse.milo:milo-sdk-server:1.1.6'
    api 'org.graalvm.polyglot:polyglot:23.1.12.1'  // 23.1 라인 최신 (GraalVM CE 21.0.2 내장 Truffle 컴파일러는 23.1.2)
    api 'org.graalvm.polyglot:python:23.1.12.1' // packaging pom: 의존성 집합(런타임 언어 모듈)
}
