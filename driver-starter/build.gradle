// driver-starter/pom.xml 대응
// dependencyManagement(netty-bom import) -> platform 의존성으로 netty 버전 정렬
// (milo의 netty 4.1.x를 reactor-netty의 4.2.x로 정렬)
dependencies {
    api platform('io.netty:netty-bom:4.2.17.Final')

    api project(':cluster-starter')
    api 'io.grpc:grpc-api:1.83.1'
    api 'io.grpc:grpc-stub:1.83.1'
    api 'io.projectreactor.netty:reactor-netty:1.3.6'
    api 'org.apache.kafka:kafka-clients:4.3.1'
    api 'org.apache.commons:commons-text:1.15.0'
    api 'org.apache.commons:commons-csv:1.14.1'
    api 'com.digitalpetri.modbus:modbus-tcp:2.1.6'
    api 'org.eclipse.milo:sdk-client:0.6.16'
    api 'org.eclipse.milo:sdk-server:0.6.16'
    api 'javax.xml.bind:jaxb-api:2.3.1' // milo 0.6.x requires javax.xml.bind.DatatypeConverter at runtime (removed from JDK 11+)
    api 'org.graalvm.polyglot:polyglot:24.1.2'
    api 'org.graalvm.polyglot:python:24.1.2' // packaging pom: 의존성 집합(런타임 언어 모듈)
}
